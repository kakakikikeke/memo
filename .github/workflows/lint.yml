name: Lint

on:
  push:
    branches:
      - "master"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up golang
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.4'
      - name: Lint
        run: |
          if [ "$(gofmt -l . | wc -l)" -ne 0 ]; then
            echo "go fmt NG"
            gofmt -l .
            exit 1
          else
            echo "go fmt OK"
          fi
